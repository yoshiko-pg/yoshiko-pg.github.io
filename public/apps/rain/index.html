      y=(.32+Math.random()*.58)*H;

    const r=pr*Math.max(W,H);
    const g=bgx.createRadialGradient(x,y,0,x,y,r);

}

function paintFog(){ // マスク:不透明=曇り最大。増えてもここが上限

function wipeFog(x,y,r,strength){
  fgx.save();
  fgx.globalCompositeOperation="destination-out";
  const g=fgx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(0,0,0,${strength})`); g.addColorStop(1,"rgba(0,0,0,0)");
  fgx.fillStyle=g; fgx.beginPath(); fgx.arc(x,y,r,0,6.2832); fgx.fill();
  fgx.restore();
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);

  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scene.width=W*DPR; scene.height=H*DPR;
  scx.setTransform(DPR,0,0,DPR,0,0);
  townBlend=1; // リサイズ時は移り変わりを打ち切る

window.addEventListener("resize",resize); resize();

/* ================= 音 ================= */
let AC=null,master=null,muted=false;
const PENTA=[0,2,4,7,9];
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination);
    // 雨音:遠くの雨のごうごう、これひとつだけ
    const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate);
    const ch=buf.getChannelData(0); let l=0;
    for(let i=0;i<len;i++){ l=l*.97+(Math.random()*2-1)*.03; ch[i]=l*3; }
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700;
    const rg=AC.createGain(); rg.gain.value=.16;
    src.connect(lp); lp.connect(rg); rg.connect(master); src.start();
  }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function tone(freq,dur,vol,type="sine",glide=0,delay=0,atk=.012){
  if(muted)return;
  const a=ac(),t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(glide) o.frequency.exponentialRampToValueAtTime(freq*glide,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+atk);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
let lastTick=0;
function tickSound(r){
  const now=performance.now();
  if(now-lastTick<80) return; lastTick=now;
  tone(620-r*4+Math.random()*60, .05, .014, "sine", .7);
}
function slipSound(){ tone(300,.32,.035,"sine",.5); }
function plopSound(r,x){ // 落ちた場所で音程が変わる(左が低く右が高く)
  const idx=Math.max(0,Math.min(4,Math.floor(x/W*5)));
  const f=392*Math.pow(2,PENTA[idx]/12)*(r>34?1:2); // 大きい雫は低め
  tone(f,1.9,.10,"sine");                 // 立ち上がりの速い基音(打鍵感)
  tone(f*2,.6,.035,"sine",0,0,.008);      // 打鍵の明るい倍音
  tone(f*3,.25,.012,"sine",0,0,.006);     // ごく薄いきらめき
}
function revealSound(){ // ランプが姿を見せる、ひそやかな音
  tone(233,.4,.028,"sine",.8);
}
function lampSound(i){
  const f=392*Math.pow(2,PENTA[i%5]/12)/((Math.floor(i/5)%2)?2:1);
  tone(f,1.4,.06,"sine");
  tone(f*2,.7,.02,"sine",0,.03);
}
function chordSound(){
  [262,392,523,659].forEach((f,i)=>tone(f,2.4,.05,"sine",0,i*.12));
}
muteBtn.addEventListener("click",()=>{
  muted=!muted;
  if(master) master.gain.value=muted?0:.55;
  muteBtn.classList.toggle("dim",muted);
  document.getElementById("icSndOn").style.display = muted?"none":"";
  document.getElementById("icSndOff").style.display = muted?"":"none";
  muteBtn.setAttribute("aria-pressed",String(muted));
});
const autoBtn=document.getElementById("auto");
let autoMode=false;
autoBtn.addEventListener("click",()=>{
  ac();
  autoMode=!autoMode;
  autoBtn.classList.toggle("on",autoMode);
  autoBtn.setAttribute("aria-pressed",String(autoMode));
  if(autoMode) autoTimer=0; // すぐ降り始める
});

/* ================= 雫 ================= */
const stuck=[], fallers=[];
const TARGET=210, INITIAL=88, BASE_R=7; // 最初はまばら、雨で増えていく
let BREAK_R=15;       // 落下サイズは以前の7割
let dropped=0;
const rnd=(a,b)=>a+Math.random()*(b-a);

function randR(){ // たまに大粒も混ざる
  const q=Math.random();
  return q<.76 ? rnd(1.6,5.2) : q<.93 ? rnd(6,9.5) : rnd(10,16);
}
function spawnStuck(x,y,r,fade){
  const nx=x??rnd(6,W-6), ny=y??rnd(60,H-10), nr=r??randR();
  // 同じ場所に降ったら、そこにある雫と合体する(指で集める時と同じ)
  for(let i=0;i<stuck.length;i++){
    const s=stuck[i];
    if(Math.hypot(s.x-nx,s.y-ny) < s.r*.92 + nr){
      s.r=Math.min(50, Math.sqrt(s.r*s.r + nr*nr*.95));
      if(s.r>=BREAK_R){ // 重くなりすぎたら、ひとりでに流れ出す
        stuck.splice(i,1);
        breakFree(s.x,s.y,s.r,true);
      }
      return;
    }
  }
  stuck.push({
    x:nx, y:ny, r:nr,
    a:fade?0:1, tail:rnd(.4,1.1),
    sq:rnd(.88,1.12), rot:rnd(-.3,.3)
  });
}
for(let i=0;i<INITIAL;i++) spawnStuck();

const collector={active:false,x:0,y:0,px:0,py:0,vx:0,vy:0,rot:0,r:BASE_R,wob:0,wobA:0,speed:0};

function absorbInto(t,silent){
  let got=false;
  for(let i=stuck.length-1;i>=0;i--){
    const s=stuck[i];
    if(Math.hypot(t.x-s.x,t.y-s.y) < t.r*.92 + s.r){
      t.r=Math.min(50, Math.sqrt(t.r*t.r + s.r*s.r*.95));
      stuck.splice(i,1);
      if(!silent) tickSound(t.r); // 音が鳴るのは指で集めた時だけ
      got=true;
    }
  }
  return got;
}
function breakFree(x,y,r,silent){
  fallers.push({x,y,r,vy:rnd(.15,.35),sway:Math.random()*6.28,trail:[],lastTrail:0});
  if(!silent){ slipSound(); if(navigator.vibrate) navigator.vibrate([8,50,12]); }
}

/* ================= 入力 ================= */
let hintShown=true;
const pointer={down:false,x:0,y:0};
function sag(){ return 14 + collector.r*.5; }
function tryGrab(x,y){ // 触れた場所に雫があれば掴む。なければ何も起きない
  for(let i=stuck.length-1;i>=0;i--){
    const s=stuck[i];
    if(Math.hypot(s.x-x,s.y-y) < s.r+16){
      stuck.splice(i,1);
      collector.active=true;
      collector.r=Math.max(4.5,s.r);
      collector.px=x; collector.py=y;
      collector.x=s.x; collector.y=s.y;
      collector.vx=0; collector.vy=0; collector.rot=0;
      collector.wobA=1.5; collector.wob=0; collector.speed=0;
      tickSound(collector.r);
      if(navigator.vibrate) navigator.vibrate(5);
      return true;
    }
  }
  return false;
}
cv.addEventListener("pointerdown",e=>{
  ac();
  pointer.down=true; pointer.x=e.clientX; pointer.y=e.clientY;
  tryGrab(e.clientX,e.clientY);
  if(hintShown){hintShown=false; hintEl.classList.add("fade");}
});
cv.addEventListener("pointermove",e=>{
  if(!pointer.down)return;
  pointer.x=e.clientX; pointer.y=e.clientY;
  if(collector.active){
    collector.px=e.clientX; collector.py=e.clientY;
  }else{
    tryGrab(e.clientX,e.clientY); // なぞる途中で雫に触れたら拾う
  }
});
window.addEventListener("pointerup",()=>{
  pointer.down=false;
  if(!collector.active)return;
  collector.active=false;
  if(collector.r>5){
    stuck.push({x:collector.x,y:collector.y,r:collector.r,a:1,tail:.8,sq:1,rot:0});
  }
});

/* ================= 更新 ================= */
let last=performance.now(), autoTimer=rnd(2500,6000);
let litCount=0, celebrated=false, fogRegrow=0;
function shortestAngle(a,b){ return Math.atan2(Math.sin(b-a),Math.cos(b-a)); }
function updateLampUI(){} // カウンター表示は廃止
updateLampUI();

function tryLight(x,y){
  if(townBlend<1) return; // 景色が流れている間は灯らない
  for(const L of LIGHTS){
    if(L.stage>=2 || L.cool>0) continue;
    if(Math.hypot(L.x-x,L.y-y)<58){
      L.stage++; L.cool=1500; L.decayT=0;
      if(L.stage===1){
        revealSound(); // 消えたランプが姿を見せる
      }else{
        lampSound(L.note); // 灯る
        litCount++; updateLampUI();
        if(navigator.vibrate) navigator.vibrate(12);
        if(litCount===LIGHTS.length && !celebrated){
          celebrated=true; chordSound();
          if(!FLAVORS) FLAVORS=[...WAKE_TEXTS,...TRAVEL_TEXTS];
          hintEl.textContent=pick(FLAVORS);
          hintEl.classList.remove("fade");
          setTimeout(()=>hintEl.classList.add("fade"),7400); // 移動が終わる頃まで
          setTimeout(nextTown,3200); // 余韻のあとで次のまちへ
        }
      }
    }
  }
}

function update(dt){
  // 雨が降り続ける:結露がどんどん増える
  if(stuck.length<TARGET && Math.random()<.24) spawnStuck(null,null,null,true);
  for(const s of stuck) if(s.a<1) s.a=Math.min(1,s.a+dt*.002);

  // まちの移り変わりを進める
  if(townBlend<1){
    townBlend=Math.min(1, townBlend+dt/5200);
    if(townBlend>=1) prevLights.length=0; // 前のまちのあかりは見えなくなった
  }

  // 曇りは初期の濃さを上限にゆっくり戻る
  fogRegrow+=dt;
  if(fogRegrow>200){
    fogRegrow=0;
    fgx.fillStyle="rgba(148,174,190,.004)"; fgx.fillRect(0,0,W,H);
  }
  for(const L of LIGHTS){
    if(L.cool>0) L.cool-=dt;
    if(L.stage===2){ // 灯ったあかりだけ、ゆっくり眠りに戻る(姿は残る)
      L.decayT+=dt;
      if(L.decayT>40000){
        L.decayT=0; L.stage=1;
        litCount--; celebrated=false; updateLampUI();
      }
    }
  }

  autoTimer-=dt;
  if(autoTimer<0){
    autoTimer = autoMode ? rnd(700,1900) : rnd(3000,7000);
    breakFree(rnd(W*.08,W*.92), rnd(-20,40), autoMode?rnd(6,13):rnd(7,12), true);
  }

  // 雫を持っていない指は、曇りをそっと拭くだけ
  if(pointer.down && !collector.active) wipeFog(pointer.x,pointer.y,16,.05);

  if(collector.active){
    const k=1-Math.pow(.93, dt/16.7);
    const tx=collector.px, ty=collector.py+sag();
    const nx=collector.x+(tx-collector.x)*k;
    const ny=collector.y+(ty-collector.y)*k;
    collector.vx=(nx-collector.x)/Math.max(dt,1)*16.7;
    collector.vy=(ny-collector.y)/Math.max(dt,1)*16.7;
    collector.x=nx; collector.y=ny;
    const sp=Math.hypot(collector.vx,collector.vy);
    collector.speed=sp;
    const targetRot = sp>1.2 ? Math.atan2(collector.vy,collector.vx)-PI/2 : 0;
    collector.rot += shortestAngle(collector.rot,targetRot)*Math.min(1,dt*.005);

    wipeFog(collector.x,collector.y,collector.r*1.3,.10);
    if(absorbInto(collector)){
      collector.wobA=Math.min(5, 2+collector.r*.06); collector.wob=0;
      if(navigator.vibrate) navigator.vibrate(4);
    }
    if(collector.wobA>0.02){collector.wob+=dt*.02; collector.wobA*=Math.pow(.994,dt);}
    if(collector.r>=BREAK_R){
      breakFree(collector.x,collector.y,collector.r);
      collector.active=false; // 指からするっと抜けて、手には何も残らない
      BREAK_R=15;
    }
  }

  for(let i=fallers.length-1;i>=0;i--){
    const f=fallers[i];
    f.vy=Math.min(f.vy+dt*.0018, .9+f.r*.008);
    f.sway+=dt*.003;
    f.x+=Math.sin(f.sway)*.35;
    f.y+=f.vy*dt*.35;
    absorbInto(f,true);
    wipeFog(f.x,f.y,f.r*1.6,.28);
    tryLight(f.x,f.y);
    f.lastTrail+=dt;
    if(f.lastTrail>60){
      f.lastTrail=0;
      f.trail.push({x:f.x+rnd(-f.r*.3,f.r*.3), y:f.y-f.r*.8, r:rnd(1,2.4), a:.9});
      if(Math.random()<.5) spawnStuck(f.x+rnd(-f.r*.4,f.r*.4), f.y-f.r, rnd(1.2,2.6), false);
    }
    for(const t of f.trail) t.a-=dt*.0006;
    f.trail=f.trail.filter(t=>t.a>0);
    if(f.y-f.r>H){
      dropped++; plopSound(f.r,f.x);
      fallers.splice(i,1);
    }
  }
}

/* ================= 描画 ================= */
function lampGlow(x,y,c,glow){ // glow: 0〜1
  const R=50+glow*70;
  const g=scx.createRadialGradient(x,y,0,x,y,R);
  g.addColorStop(0,`rgba(${c},${.5*glow})`);
  g.addColorStop(.4,`rgba(${c},${.2*glow})`);
  g.addColorStop(1,`rgba(${c},0)`);
  scx.fillStyle=g; scx.beginPath(); scx.arc(x,y,R,0,6.2832); scx.fill();
  scx.beginPath(); scx.arc(x,y,3+glow*2.5,0,6.2832);
  scx.fillStyle=`rgba(255,252,240,${.25+.6*glow})`; scx.fill();
}
function lampDark(x,y){ // 消えたランプ:灯るランプのグレー版
  const R=30;
  const g=scx.createRadialGradient(x,y,0,x,y,R);
  g.addColorStop(0,"rgba(152,166,178,.15)");
  g.addColorStop(.4,"rgba(152,166,178,.06)");
  g.addColorStop(1,"rgba(152,166,178,0)");
  scx.fillStyle=g; scx.beginPath(); scx.arc(x,y,R,0,6.2832); scx.fill();
  scx.beginPath(); scx.arc(x,y,3.5,0,6.2832);
  scx.fillStyle="rgba(188,198,208,.32)"; scx.fill();
}
function drawLamp(x,y,L){
  if(L.stage===1) lampDark(x,y);
  else if(L.stage>=2) lampGlow(x,y,L.c,1);
}
function composeScene(){ // 背景+あかり+曇り → 雫はこれを映す
  if(townBlend<1){ // 車窓のように、景色が右へ流れて次のまちが来る
    const e=(1-Math.cos(townBlend*PI))/2;
    const off=e*W;
    scx.drawImage(bgPrev,0,0,bgPrev.width,bgPrev.height,off,0,W,H);
    scx.drawImage(bg,0,0,bg.width,bg.height,off-W,0,W,H);
    // まちとまちの間は深い夜霧:境目そのものを見せない
    const MW=W*.8, x0=off-MW/2;
    const hz=scx.createLinearGradient(x0,0,x0+MW,0);
    hz.addColorStop(0,"rgba(7,12,19,0)");
    hz.addColorStop(.35,"rgba(7,12,19,.72)");
    hz.addColorStop(.5,"rgba(7,12,19,.92)");
    hz.addColorStop(.65,"rgba(7,12,19,.72)");
    hz.addColorStop(1,"rgba(7,12,19,0)");
    scx.fillStyle=hz; scx.fillRect(x0,0,MW,H);
    const fz=scx.createLinearGradient(x0,0,x0+MW,0);
    fz.addColorStop(0,"rgba(125,155,175,0)");
    fz.addColorStop(.5,"rgba(125,155,175,.11)");
    fz.addColorStop(1,"rgba(125,155,175,0)");
    scx.fillStyle=fz; scx.fillRect(x0,0,MW,H);
    // 前のまちのあかりは、灯ったまま景色と一緒に流れて見えなくなる
    for(const L of prevLights){
      if(L.stage<=0 || L.x+off>W+120) continue;
      drawLamp(L.x+off, L.y, L);
    }
  }else{
    scx.drawImage(bg,0,0,bg.width,bg.height,0,0,W,H);
  }
  for(const L of LIGHTS){
    if(L.stage<=0) continue;
    drawLamp(L.x, L.y, L);
  }
  scx.globalAlpha=FOGA;
  scx.drawImage(fog,0,0,fog.width,fog.height,0,0,W,H);
  scx.globalAlpha=1;
}
function dropBody(r,stretch){
  ctx.beginPath();
  ctx.ellipse(0, r*stretch*.06, r, r*stretch, 0, 0, 6.2832);
}
function drawSmear(r,stretch,tailLen,alpha){
  if(tailLen<=0.01) return;
  const top=-r*stretch-r*tailLen, base=-r*stretch*.55;
  const wTop=r*.42, wBase=r*.8;
  const g=ctx.createLinearGradient(0,top,0,base);
  g.addColorStop(0,"rgba(185,215,232,0)");
  g.addColorStop(1,`rgba(185,215,232,${.14*alpha})`);
  ctx.beginPath();
  ctx.moveTo(-wTop,top);
  ctx.quadraticCurveTo(-wBase,(top+base)/2, -wBase,base);
  ctx.lineTo(wBase,base);
  ctx.quadraticCurveTo(wBase,(top+base)/2, wTop,top);
  ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
}
function drawRefract(x,y,r,stretch,tailLen,alpha,rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  const sh=ctx.createRadialGradient(r*.1,r*.34,r*.2, r*.1,r*.34,r*1.3);
  sh.addColorStop(0,`rgba(0,0,0,${.28*alpha})`); sh.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(r*.1,r*.34,r*1.3,0,6.2832); ctx.fill();
  drawSmear(r,stretch,tailLen,alpha);
  dropBody(r,stretch); ctx.clip();
  // 曇りごと映す:雫の色が窓に馴染む
  ctx.globalAlpha=alpha;
  ctx.rotate(-rot);
  ctx.scale(1.22,-1.22);
  ctx.drawImage(scene,0,0,scene.width,scene.height,-x,-y,W,H);
  ctx.restore();

  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha=alpha;
  dropBody(r,stretch); ctx.clip();
  const g=ctx.createLinearGradient(0,-r*stretch,0,r*stretch);
  g.addColorStop(0,"rgba(5,9,15,.45)");
  g.addColorStop(.5,"rgba(5,9,15,0)");
  g.addColorStop(1,"rgba(220,242,252,.08)");
  ctx.fillStyle=g; ctx.fillRect(-r,-r*stretch-1,r*2,r*stretch*2+2);
  const cg=ctx.createRadialGradient(0,r*stretch*.5,0, 0,r*stretch*.5,r*.85);
  cg.addColorStop(0,`rgba(226,246,255,${.26*alpha})`);
  cg.addColorStop(1,"rgba(226,246,255,0)");
  ctx.fillStyle=cg; ctx.fillRect(-r,-r*stretch,r*2,r*stretch*2);
  ctx.restore();

  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha=alpha;
  dropBody(r,stretch);
  ctx.strokeStyle=`rgba(8,14,22,${.36*alpha})`; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-r*.34,-r*stretch*.3, r*.13, r*.24, -.5, 0, 6.2832);
  ctx.fillStyle=`rgba(240,250,255,${.65*alpha})`; ctx.fill();
  ctx.beginPath();
  ctx.ellipse(r*.28, r*stretch*.42, r*.09, r*.05, .4, 0, 6.2832);
  ctx.fillStyle=`rgba(240,250,255,${.25*alpha})`; ctx.fill();
  ctx.restore();
}
function drawDot(x,y,r,a,sq=1,rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(1,sq);
  const sh=ctx.createRadialGradient(r*.12,r*.3,0, r*.12,r*.3,r*1.15);
  sh.addColorStop(0,`rgba(0,0,0,${.22*a})`); sh.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(r*.12,r*.3,r*1.15,0,6.2832); ctx.fill();
  const g=ctx.createRadialGradient(0,r*.2,0, 0,0,r);
  g.addColorStop(0,`rgba(205,232,246,${.20*a})`);
  g.addColorStop(.6,`rgba(150,190,214,${.10*a})`);
  g.addColorStop(1,`rgba(10,18,28,${.30*a})`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.fill();
  const cg=ctx.createRadialGradient(0,r*.35,0, 0,r*.35,r*.8);
  cg.addColorStop(0,`rgba(232,248,255,${.26*a})`);
  cg.addColorStop(1,"rgba(232,248,255,0)");
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(-r*.34,-r*.36, Math.max(.5,r*.18), 0,6.2832);
  ctx.fillStyle=`rgba(248,252,255,${.6*a})`; ctx.fill();
  ctx.restore();
}

function render(){
  composeScene();
  ctx.drawImage(scene,0,0,scene.width,scene.height,0,0,W,H);

  for(const s of stuck){
    if(s.r<6) drawDot(s.x,s.y,s.r,s.a,s.sq,s.rot);
    else drawRefract(s.x,s.y,s.r,s.sq,s.tail*.5,s.a,s.rot*.4);
  }
  for(const f of fallers){
    for(const t of f.trail) drawDot(t.x,t.y,t.r,t.a);
    const st=Math.min(1.5, 1+f.vy*.45);
    drawRefract(f.x,f.y,f.r/Math.sqrt(st),st, .6+f.vy*.9, 1);
  }
  if(collector.active){
    const sq=1+Math.sin(collector.wob)*collector.wobA*.02;
    const move=Math.min(.4, collector.speed*.045);
    drawRefract(collector.x,collector.y,
      collector.r*sq/(1+move*.5), (1+move)/sq, .25+move*1.6, 1, collector.rot);
    if(collector.r>BREAK_R*.8){
      ctx.beginPath();
      ctx.ellipse(collector.x,collector.y+collector.r*1.05,collector.r*.5,collector.r*.14,0,0,6.2832);
      ctx.fillStyle="rgba(200,230,245,.10)"; ctx.fill();
    }
  }
}

function loop(t){
  const dt=Math.min(50,t-last); last=t;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
